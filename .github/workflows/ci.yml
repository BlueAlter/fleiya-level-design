name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-linux:
    name: Linux Gate & Build (cargo xtask check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcursor-dev \
            libxi-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run xtask check (fmt, clippy -D warnings, test, arch-lint)
        run: cargo xtask check

  check-windows:
    name: Windows Gate & Build (cargo xtask check)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run xtask check (fmt, clippy -D warnings, test, arch-lint)
        run: cargo xtask check
