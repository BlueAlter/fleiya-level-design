[package]
name = "lc_app_slint"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "levelcraft_slint"
path = "src/main.rs"

# Slint generated code requires unsafe code and allows it internally, 
# so workspace-level forbid(unsafe_code) is overridden for this app crate.
[lints.rust]
unsafe_code = "allow"

[dependencies]
lc_core = { workspace = true }
lc_io = { workspace = true }
slint = "1.18.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }

[build-dependencies]
slint-build = "1.18.1"
